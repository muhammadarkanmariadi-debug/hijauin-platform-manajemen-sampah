services:
  db:
    image: postgres:16-alpine
    container_name: hijauin_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hijauin}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_DATABASE:-hijauin}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hijauin_dev_network

  redis:
    image: redis:7-alpine
    container_name: hijauin_dev_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hijauin_dev_network

  backend:
    build:
      context: ./hijauin-backend
      dockerfile: Dockerfile
    container_name: hijauin_dev_backend
    restart: unless-stopped
    environment:
      APP_NAME: Hijauin
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:7bQ+d6HqV7R8j4M9xL2pQ1sT3vW5yZ8aC0eG2iK4mO6=}
      APP_DEBUG: "true"
      APP_URL: http://localhost:5000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-hijauin}
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./hijauin-backend:/var/www
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hijauin_dev_network

  frontend:
    build:
      context: ./hijauin-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
    container_name: hijauin_dev_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - hijauin_dev_network

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  hijauin_dev_network:
    driver: bridge
